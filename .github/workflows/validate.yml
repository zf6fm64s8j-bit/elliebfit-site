name: Validate

on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    paths-ignore: ['**/*.md']
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate local pages, links, assets, and IDs
        run: python3 scripts/validate-site.py
      - name: Check SEO and AI-crawler contract
        run: python3 docs/source/check-seo.py
