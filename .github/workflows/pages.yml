name: Publish allowlisted site

# Intentionally manual. Never publishes on push while Ellen reviews the candidate.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the approved candidate (false builds an artifact only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify source
        run: ./scripts/verify.sh
      - name: Build and validate exact public artifact
        run: python3 scripts/build-public-site.py --output "${RUNNER_TEMP}/elliebfit-public"
      - name: Upload allowlisted artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/elliebfit-public

  deploy:
    if: inputs.publish == true && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
