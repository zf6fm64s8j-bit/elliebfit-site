  <!--
    Consult-form handler.

    The bundled build ships "SEND REQUEST" wired to an empty function, so the
    form silently discards every enquiry. The bundle replaces the whole DOM on
    load, so this listener is registered on `window` in the capture phase and
    delegates by matching the event target — that survives the swap, where a
    direct node reference would not. It must also stay in <head>: the bundle
    tears down the parser, so a trailing script at the end of <body> never runs.

    Delivery: posts to Formspree when FORMSPREE_ENDPOINT is set, and falls back
    to composing a mailto: when it is blank or the request fails.
  -->
  <script>
  (function () {
    'use strict';

    // Paste the Formspree endpoint here, e.g.
    // 'https://formspree.io/f/abcdwxyz'. Blank = mailto fallback.
    var FORMSPREE_ENDPOINT = 'https://formspree.io/f/xbgranpq';

    var MAILTO = 'ellen@elliebfit.com';
    var INTEREST = ['IN-HOME', 'SEMI-PRIVATE', 'VIRTUAL', 'FRIDAY CLASS'];
    var interest = '';
    var sending = false;

    function txt(el) {
      return ((el && el.textContent) || '').replace(/\s+/g, ' ').trim().toUpperCase();
    }

    function closestButton(node) {
      for (var i = 0; node && i < 6; node = node.parentElement, i++) {
        if (node.tagName === 'BUTTON') return node;
      }
      return null;
    }

    // The form controls live in the same card as the send button; walk up until
    // a container holds both an email input and a textarea.
    function fieldsFor(btn) {
      var scope = btn;
      for (var i = 0; scope && i < 12; scope = scope.parentElement, i++) {
        if (scope.querySelector && scope.querySelector('textarea') &&
            scope.querySelector('input[type="email"]')) break;
      }
      if (!scope) scope = document.body;
      return {
        name: scope.querySelector('input[type="text"]'),
        email: scope.querySelector('input[type="email"]'),
        message: scope.querySelector('textarea')
      };
    }

    function flash(btn, msg, kind) {
      var box = document.getElementById('__consult_msg');
      if (!box) {
        box = document.createElement('div');
        box.id = '__consult_msg';
        box.setAttribute('role', 'status');
        box.setAttribute('aria-live', 'polite');
        box.style.cssText = 'margin-top:12px;font:14px/1.5 -apple-system,BlinkMacSystemFont,' +
          'sans-serif;padding:10px 14px;border-radius:8px;';
        if (btn.parentNode) btn.parentNode.insertBefore(box, btn.nextSibling);
      }
      var map = {
        ok:      ['#CFE2D8', '#2E4A42'],
        error:   ['#FDECE7', '#D46B4D'],
        pending: ['#F7DCC9', '#2E4A42']
      };
      var palette = map[kind] || map.pending;
      box.style.background = palette[0];
      box.style.color = palette[1];
      box.textContent = msg;
    }

    function mailtoFallback(payload) {
      var body =
        'Name: ' + payload.name + '\n' +
        'Email: ' + payload.email + '\n' +
        'Interested in: ' + payload.interest + '\n\n' +
        'Working toward:\n' + payload.message + '\n';
      window.location.href = 'mailto:' + MAILTO +
        '?subject=' + encodeURIComponent('Free consult request — ' + payload.name) +
        '&body=' + encodeURIComponent(body);
    }

    // The build renders the interest chips as plain buttons, so their selected
    // state is conveyed by colour alone. Mirror it into aria-pressed, and name
    // the group, so assistive tech can report what is chosen.
    var _cv = document.createElement('canvas'); _cv.width = _cv.height = 1;
    var _cx = _cv.getContext('2d', { willReadFrequently: true });
    function chipLum(el) {
      // computed backgroundColor comes back as oklch(), so resolve it through a
      // canvas rather than parsing the numbers as if they were rgb
      var c = getComputedStyle(el).backgroundColor;
      try {
        _cx.clearRect(0, 0, 1, 1); _cx.fillStyle = '#fff'; _cx.fillStyle = c;
        _cx.fillRect(0, 0, 1, 1);
        var d = _cx.getImageData(0, 0, 1, 1).data;
        return (0.2126 * d[0] + 0.7152 * d[1] + 0.0722 * d[2]) / 255;
      } catch (e) { return 1; }
    }
    function syncChips() {
      var chips = [];
      var all = document.querySelectorAll('button');
      for (var i = 0; i < all.length; i++) {
        if (INTEREST.indexOf(txt(all[i])) !== -1) chips.push(all[i]);
      }
      if (!chips.length) return false;
      for (var j = 0; j < chips.length; j++) {
        // selected chips are filled coral; unselected use the pale sage tint
        chips[j].setAttribute('aria-pressed', chipLum(chips[j]) < 0.55 ? 'true' : 'false');
      }
      var group = chips[0].parentNode;
      if (group && !group.getAttribute('role')) {
        group.setAttribute('role', 'group');
        if (document.getElementById('abf-interest-label')) {
          group.setAttribute('aria-labelledby', 'abf-interest-label');
        }
      }
      return true;
    }
    // The chips are multi-select and the build pre-selects "In-home", but the
    // click handler below only ever saw the last chip pressed -- so a visitor
    // who left the default alone was reported as "Not specified". Read the
    // selected state off the chips themselves at send time instead.
    var INTEREST_LABEL = {
      'IN-HOME': 'In-home', 'SEMI-PRIVATE': 'Semi-private',
      'VIRTUAL': 'Virtual', 'FRIDAY CLASS': 'Friday class'
    };
    function selectedInterest() {
      var picked = [];
      var all = document.querySelectorAll('button');
      for (var i = 0; i < all.length; i++) {
        var l = txt(all[i]);
        if (INTEREST.indexOf(l) !== -1 && chipLum(all[i]) < 0.55) {
          picked.push(INTEREST_LABEL[l] || l);
        }
      }
      return picked.length ? picked.join(', ') : (interest || 'Not specified');
    }

    // the bundle replaces the DOM after load, so poll briefly until chips exist
    var tries = 0;
    var chipTimer = setInterval(function () {
      if (syncChips() || ++tries > 40) clearInterval(chipTimer);
    }, 150);

    function sendButton() {
      var all = document.querySelectorAll('button');
      for (var i = 0; i < all.length; i++) {
        if (txt(all[i]) === 'SEND REQUEST') return all[i];
      }
      return null;
    }

    // The build wraps the consult fields in divs, not a <form>, so Enter in a
    // single-line field does nothing at all. Route it to the send button --
    // which the capture handler below then takes over. The textarea is left
    // alone: Enter there means a new line.
    window.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' || e.shiftKey || e.altKey || e.metaKey || e.ctrlKey) return;
      var el = e.target;
      if (!el || (el.id !== 'abf-name' && el.id !== 'abf-email')) return;
      var btn = sendButton();
      if (!btn) return;
      e.preventDefault();
      btn.click();
    }, true);

    window.addEventListener('click', function (e) {
      var btn = closestButton(e.target);
      if (!btn) return;

      var label = txt(btn);

      if (INTEREST.indexOf(label) !== -1) {
        interest = label;
        setTimeout(syncChips, 0);
        return;
      }

      if (label !== 'SEND REQUEST') return;

      // This click is ours. The bundle wires this button to its own React
      // onClick, which sets window.location.href to a mailto: -- so unless the
      // event stops here the visitor gets their mail client opening on top of
      // the Formspree send. Stop it ahead of every return below, including
      // validation failures and re-entrant clicks, not just the success path.
      e.preventDefault();
      e.stopImmediatePropagation();

      if (sending) return;

      var f = fieldsFor(btn);
      var payload = {
        name: f.name ? f.name.value.trim() : '',
        email: f.email ? f.email.value.trim() : '',
        message: f.message ? f.message.value.trim() : '',
        interest: selectedInterest()
      };

      if (!payload.name || !payload.email) {
        flash(btn, 'Please add your name and email so Ellen can reply.', 'error');
        return;
      }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(payload.email)) {
        flash(btn, 'That email address looks incomplete — please check it.', 'error');
        return;
      }
      if (!payload.message) payload.message = '(not specified)';

      if (!FORMSPREE_ENDPOINT) {
        flash(btn, 'Opening your email app with the request ready to send. If nothing happens, email ' +
          MAILTO + ' directly.', 'ok');
        mailtoFallback(payload);
        return;
      }

      sending = true;
      btn.style.opacity = '0.6';
      flash(btn, 'Sending your request…', 'pending');

      fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          name: payload.name,
          email: payload.email,
          interest: payload.interest,
          message: payload.message,
          _subject: 'Free consult request — ' + payload.name
        })
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        flash(btn, 'Thanks ' + payload.name.split(' ')[0] +
          ' — your request is on its way. Ellen usually replies the same day.', 'ok');
        if (f.name) f.name.value = '';
        if (f.email) f.email.value = '';
        if (f.message) f.message.value = '';
      }).catch(function () {
        flash(btn, "That didn't go through — opening your email app instead.", 'error');
        mailtoFallback(payload);
      }).then(function () {
        sending = false;
        btn.style.opacity = '';
      });
    }, true);
  })();
  </script>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own

  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"afb2ae5f-5137-43b9-a00e-c93d5df7fc4b\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"icon\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23FAF2EC'/%3E%3Cpolygon points='50,18 96,64 74,64 50,40 26,64 4,64' fill='%23E4795A'/%3E%3C/svg%3E\">\n<link rel=\"apple-touch-icon\" href=\"assets/apple-touch-icon.png\">\n<style id=\"abf-responsive\">\n/* Mobile layer. The build ships no media queries and styles every element\n   inline, so these overrides are matched on inline-style substrings and must\n   carry !important to beat the element's own style attribute. */\n@media (max-width: 760px) {\n  /* section gutters */\n  [style*=\"max-width: 1240px\"] { padding-left: 20px !important; padding-right: 20px !important; }\n\n  /* header: let the nav drop to its own centred row */\n  [style*=\"padding: 14px 32px\"] { flex-wrap: wrap !important; justify-content: center !important; gap: 10px !important; }\n  [style*=\"gap: 28px\"] { flex-wrap: wrap !important; justify-content: center !important; gap: 8px 16px !important; font-size: 11px !important; }\n\n  /* grids whose min track is wider than a phone */\n  [style*=\"minmax(400px\"], [style*=\"minmax(320px\"], [style*=\"minmax(300px\"],\n  [style*=\"minmax(280px\"], [style*=\"minmax(240px\"], [style*=\"minmax(220px\"] { grid-template-columns: 1fr !important; }\n\n  /* display type */\n  [style*=\"font-size: 76px\"] { font-size: 40px !important; }\n  [style*=\"font-size: 44px\"] { font-size: 30px !important; }\n  [style*=\"font-size: 42px\"] { font-size: 28px !important; }\n  [style*=\"font-size: 30px\"] { font-size: 24px !important; }\n  [style*=\"font-size: 28px\"] { font-size: 23px !important; }\n\n  /* photos: 520/560px tall is most of a phone screen */\n  [style*=\"height: 520px\"] { height: 320px !important; }\n  [style*=\"height: 560px\"] { height: 300px !important; }\n\n  /* stop any stray fixed-width child from widening the page */\n  body { overflow-x: hidden; }\n}\n/* four steps: 2x2 between phone and desktop rather than an orphaned 4th */\n@media (min-width: 761px) and (max-width: 1099px) {\n  [style*=\"minmax(220px\"] { grid-template-columns: repeat(2, 1fr) !important; }\n}\n@media (max-width: 420px) {\n  [style*=\"font-size: 76px\"] { font-size: 34px !important; }\n}\n\n\n/* ---- interaction fixes ---------------------------------------------------\n   These are ordinary selectors, not inline-style substring matches: every\n   element they target carries an id or sits under a named nav, so none of\n   them needs !important to win. */\n\n/* Anchor targets sit beneath the sticky header -- 70px on desktop, 140px on a\n   phone where the nav wraps to a second row. Without an offset, jumping to\n   #rates parks the heading behind the header. Measured after the target-size\n   change below, which is what sets the header's height. */\n#training, #classes, #about, #rates, #resources, #book,\n#faq, #how-it-works, #who-for { scroll-margin-top: 88px; }\n\n/* Keyboard focus was invisible sitewide. Ink carries on every surface the\n   site uses: 11.9:1 on cream, 12.6:1 on white, 4.5:1 on the coral fill. */\n:focus-visible { outline: 3px solid #20342E; outline-offset: 2px; border-radius: 2px; }\n\n/* Nav links were 12-13px tall. WCAG 2.2 SC 2.5.8 (AA) asks 24x24; 44px is the\n   AAA/HIG figure and there is room for it on desktop. Links inline in prose\n   are exempt from 2.5.8 and are deliberately left alone. */\nnav[aria-label=\"Primary\"] a {\n  display: inline-flex; align-items: center; justify-content: center;\n  min-height: 44px; box-sizing: border-box;\n}\n\n@media (max-width: 760px) {\n  #training, #classes, #about, #rates, #resources, #book,\n  #faq, #how-it-works, #who-for { scroll-margin-top: 172px; }\n\n  /* 44px per link would wrap into a ~215px sticky header on a phone. 30px\n     clears the 24px AA floor for 18px of extra header instead. */\n  nav[aria-label=\"Primary\"] a { min-height: 30px; }\n}\n<\/style>\n<style>/* vietnamese */\n\n/* latin-ext */\n\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"assets/fonts/archivo-400.woff2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n\n/* latin-ext */\n\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"assets/fonts/archivo-400.woff2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n\n/* latin-ext */\n\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"assets/fonts/archivo-400.woff2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n\n/* latin-ext */\n\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"assets/fonts/archivo-400.woff2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* viet ething you love, we&#8217;ll help you get stronger, move with confidence, and enjoy the process.<\/div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px;\">\n          <a href=\"#book\" style=\"background: oklch(0.665 0.135 38); color: oklch(0.265 0.032 168); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; padding: 16px 28px; border-radius: 4px;\">Start with a free 20-minute consult<\/a>\n          <a href=\"#rates\" style=\"border: 1.5px solid oklch(0.72 0.06 168); color: oklch(0.36 0.045 168); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; padding: 14.5px 26px; border-radius: 4px;\">See rates<\/a>\n        <\/div>\n        <div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.44 0.03 168); margin-top: 30px; max-width: 540px;\">Serving Scottsdale, Paradise Valley, Phoenix, Cave Creek, Mesa, Tempe, Glendale, and nearby communities.<\/div>\n      <\/div>\n      <img src=\"assets/photos/hero.webp\" fetchpriority=\"high\" decoding=\"async\" alt=\"Ellen DeVore on a desert trail at sunset with her dog Cricket\" style=\"width: 100%; height: 520px; object-fit: cover; object-position: 50% 45%; border-radius: 24px; display: block;\">\n    <\/div>\n  <\/div>\n\n  <div style=\"background: oklch(0.995 0.003 45); border-bottom: 1px solid oklch(0.905 0.022 45);\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 22px 32px; display: flex; flex-wrap: wrap; gap: 14px 40px; align-items: center; justify-content: space-between; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: oklch(0.50 0.03 40);\">\n        <div>NASM-CPT &middot; Certified personal trainer<\/div>\n        <div>NASM-CES &middot; Training that adapts to changing bodies and old injuries<\/div>\n        <div>NASM-FNS &middot; Fitness nutrition<\/div>\n        <div>PWR!Moves® &middot; Parkinson&#8217;s-specific movement training<\/div>\n        <div>Female Functional Fitness &middot; Built around women&#8217;s needs<\/div>\n        <div style=\"color: oklch(0.665 0.135 38); font-weight: 600;\">13 years &middot; clients ages 8&ndash;92<\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"training\" style=\"max-width: 1240px; margin: 0 auto; padding: 84px 32px 20px;\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 30px;\">\n      <div>\n        <div style=\"font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-bottom: 8px;\">Training<\/div>\n        <h2 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; margin: 0;\">Three ways to work together<\/h2>\n      <\/div>\n      <a href=\"#book\" style=\"font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 5px;\">Not sure which fits? Start with a free consult<\/a>\n    <\/div>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;\">\n\n      <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column;\">\n        <img src=\"assets/photos/in-home.webp\" alt=\"A client training with a resistance band in her living room\" loading=\"lazy\" style=\"width: 100%; height: 190px; object-fit: cover; object-position: 50% 32%; display: block;\">\n        <div style=\"padding: 22px; display: flex; flex-direction: column; gap: 12px; flex: 1;\">\n          <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase;\">In-home 1:1<\/div>\n          <div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.415 0.025 168);\">Your home, your goals, your pace. Ellen brings the equipment and adapts each session to how you&#8217;re feeling that day&mdash;whether you&#8217;re building confidence, working around a cranky joint, or training toward a bigger goal.<\/div>\n          <div style=\"margin-top: auto; padding-top: 12px; display: flex; align-items: baseline; gap: 8px; border-top: 1px solid oklch(0.925 0.02 45);\">\n            <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; color: oklch(0.665 0.135 38);\">$90<\/div>\n            <div style=\"font-size: 12px; color: oklch(0.555 0.022 40);\">per hour · packages down to $80<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column;\">\n        <img src=\"assets/photos/semi-private.webp\" alt=\"A couple doing bodyweight squats side by side\" loading=\"lazy\" style=\"width: 100%; height: 190px; object-fit: cover; object-position: 50% 30%; display: block;\">\n        <div style=\"padding: 22px; display: flex; flex-direction: column; gap: 12px; flex: 1;\">\n          <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase;\">Semi-private<\/div>\n          <div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.415 0.025 168);\">Bring a partner, spouse, or friend. Train together, pay less than the solo rate, and still receive programming that fits each person individually.<\/div>\n          <div style=\"margin-top: auto; padding-top: 12px; display: flex; align-items: baseline; gap: 8px; border-top: 1px solid oklch(0.925 0.02 45);\">\n            <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; color: oklch(0.665 0.135 38);\">75%<\/div>\n            <div style=\"font-size: 12px; color: oklch(0.555 0.022 40);\">of the hourly rate, each<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column;\">\n        <img src=\"assets/photos/virtual.webp\" alt=\"A laptop on a table showing a live virtual class\" loading=\"lazy\" style=\"width: 100%; height: 190px; object-fit: cover; object-position: 50% 45%; display: block;\">\n        <div style=\"padding: 22px; display: flex; flex-direction: column; gap: 12px; flex: 1;\">\n          <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase;\">Virtual<\/div>\n          <div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.415 0.025 168);\">Great coaching, wherever you are. Train from your living room, hotel, or out-of-state home using the equipment you have&mdash;or no equipment at all.<\/div>\n          <div style=\"margin-top: auto; padding-top: 12px; display: flex; align-items: baseline; gap: 8px; border-top: 1px solid oklch(0.925 0.02 45);\">\n            <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; color: oklch(0.665 0.135 38);\">$90<\/div>\n            <div style=\"font-size: 12px; color: oklch(0.555 0.022 40);\">Virtual sessions use the same hourly and package rates.<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"classes\" style=\"max-width: 1240px; margin: 44px auto 0; padding: 0 32px;\">\n    <div style=\"background: linear-gradient(160deg, oklch(0.955 0.035 45) 0%, oklch(0.965 0.022 90) 55%, oklch(0.945 0.035 165) 100%); color: oklch(0.30 0.035 168); border-radius: 24px; padding: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; align-items: center;\">\n      <div>\n        <div style=\"display: inline-block; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; background: oklch(0.895 0.055 45); color: oklch(0.26 0.032 168); padding: 6px 12px; border-radius: 999px; margin-bottom: 18px;\">Free · every Friday<\/div>\n        <h2 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 42px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; margin: 0;\">Express half-hour virtual class<\/h2>\n        <div style=\"font-size: 15px; line-height: 1.65; margin-top: 16px; color: oklch(0.44 0.03 168); max-width: 520px; text-wrap: pretty;\">A quick, upbeat full-body workout you can fit into your lunch break. Ellen demonstrates every movement with easier and more challenging options, so you can work at the level that feels right that day. No fancy equipment required.<\/div>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 14px; background: oklch(0.995 0.003 45); border: 1px solid oklch(0.90 0.03 45); border-radius: 20px; padding: 24px;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n          <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.05em; text-transform: uppercase;\">Fridays<\/div>\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.52 0.03 168);\">30 min<\/div>\n        <\/div>\n        <div style=\"font-size: 14px; color: oklch(0.40 0.03 168);\">10:00 a.m. Arizona time · 12:00 p.m. Central time<\/div>\n        <a href=\"free-class-sign-up/\" style=\"background: oklch(0.665 0.135 38); color: oklch(0.265 0.032 168); text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; padding: 15px; border-radius: 4px;\">Join Friday&#8217;s free class<\/a>\n        <div style=\"font-size: 12px; color: oklch(0.52 0.03 168); line-height: 1.5;\">Hosting a class at your facility? Ellen builds custom class programming too.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"about\" style=\"max-width: 1240px; margin: 0 auto; padding: 84px 32px 20px;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 44px; align-items: start;\">\n      <img src=\"assets/photos/plank.webp\" alt=\"Plank hold\" loading=\"lazy\" style=\"width: 100%; height: 560px; object-fit: cover; object-position: 50% 25%; border-radius: 24px; display: block;\">\n      <div>\n        <div style=\"font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-bottom: 8px;\">About<\/div>\n        <h2 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; margin: 0;\">Hi, I'm Ellen<\/h2>\n        <div style=\"font-size: 15px; line-height: 1.75; color: oklch(0.375 0.028 168); margin-top: 18px; display: flex; flex-direction: column; gap: 14px; text-wrap: pretty;\">\n          <div>I found my way into personal training while teaching spin at the YMCA in 2006. I loved seeing people discover that they were stronger and more capable than they thought. I certified in 2010 and have been coaching ever since.<\/div>\n          <div>After 13 years of working with clients ages 8&ndash;92, I&#8217;ve learned that good training is never one-size-fits-all. Some days we build strength from a chair. Other days we lift, sweat, laugh, and leave a busy week behind. The plan should adapt to your body, your goals, and your life&mdash;not the other way around.<\/div>\n          <div>My husband Michael and I moved to Arizona in 2023, and Above &amp; Beyond Fitness began here. When I&#8217;m not training, I&#8217;m usually with my horse Cisco, paddleboarding with Cricket, or baking cookies. Yes, trainers eat cookies.<\/div>\n        <\/div>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 26px;\">\n          <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 14px; padding: 14px;\">\n            <div style=\"font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-bottom: 6px;\">Education<\/div>\n            <div style=\"font-size: 13px; line-height: 1.6;\">B.A. Kansas State University<br>Wellspring School of Allied Health<\/div>\n          <\/div>\n          <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 14px; padding: 14px;\">\n            <div style=\"font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-bottom: 6px;\">Certifications<\/div>\n            <div style=\"font-size: 13px; line-height: 1.6;\">NASM CPT · CES · FNS<br>PWR!Moves® · Female Functional Fitness<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"how-it-works\" style=\"max-width: 1240px; margin: 0 auto; padding: 84px 32px 20px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 26px;\">\n      <h2 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; margin: 0;\">Your next step has a path<\/h2>\n      <div style=\"font-size: 13px; color: oklch(0.50 0.03 168);\">Starting is simple<\/div>\n    <\/div>\n    <div style=\"font-size: 15px; line-height: 1.7; color: oklch(0.375 0.028 168); max-width: 620px; margin-bottom: 22px;\">Tell Ellen what you&#8217;d like to improve, talk through your goals during a relaxed 20-minute consultation, choose the format that fits your life, and begin with a session built around you.<\/div>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px;\">\n      <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\"><div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: oklch(0.665 0.135 38); line-height: 1;\">1<\/div><div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">Tell me what you want to improve.<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\"><div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: oklch(0.665 0.135 38); line-height: 1;\">2<\/div><div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">Have a relaxed 20-minute consultation.<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\"><div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: oklch(0.665 0.135 38); line-height: 1;\">3<\/div><div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">Choose the training format that fits.<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\"><div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: oklch(0.665 0.135 38); line-height: 1;\">4<\/div><div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">Start with a plan built around you.<\/div><\/div><\/div>\n  <\/div>\n\n  <div id=\"rates\" style=\"max-width: 1240px; margin: 0 auto; padding: 84px 32px 20px;\">\n    <div style=\"font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-bottom: 8px;\">Rates<\/div>\n percase; background: oklch(0.985 0.02 45); color: oklch(0.50 0.14 38); padding: 4px 8px; border-radius: 999px;\">Most picked<\/div>\n        <div style=\"font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.85;\">10 hours<\/div>\n        <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.05; margin-top: 8px;\">$850<\/div>\n        <div style=\"font-size: 12px; opacity: 0.85; margin-top: 4px;\">$85 / hour<\/div>\n      <\/div>\n      <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 22px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: oklch(0.555 0.022 40);\">20 hours<\/div>\n        <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.05; margin-top: 8px;\">$1,640<\/div>\n        <div style=\"font-size: 12px; color: oklch(0.555 0.022 40); margin-top: 4px;\">$82 / hour<\/div>\n      <\/div>\n      <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 22px;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: oklch(0.555 0.022 40);\">40 hours<\/div>\n        <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.05; margin-top: 8px;\">$3,200<\/div>\n        <div style=\"font-size: 12px; color: oklch(0.555 0.022 40); margin-top: 4px;\">$80 / hour<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 14px;\">\n      <div style=\"background: oklch(0.885 0.042 165 / 0.35); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 18px 20px; font-size: 13px; line-height: 1.65; color: oklch(0.375 0.028 168);\"><strong>Booking:<\/strong> sessions are booked in 15-minute increments. Package pricing lowers the hourly rate from $87 to $80. Not sure which option fits? Start with the free consultation.<\/div>\n      <div style=\"background: oklch(0.885 0.042 165 / 0.35); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 18px 20px; font-size: 13px; line-height: 1.65; color: oklch(0.375 0.028 168);\"><strong>Semi-private:<\/strong> for a one-hour semi-private session, each participant uses 45 minutes from their package&mdash;or 90 minutes if one person is paying for both participants.<\/div>\n      <div style=\"background: oklch(0.885 0.042 165 / 0.35); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 18px 20px; font-size: 13px; line-height: 1.65; color: oklch(0.375 0.028 168);\"><strong>Classes:<\/strong> the Friday express class is free. Hosting a class at your facility is quoted separately — ask Ellen.<\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"who-for\" style=\"max-width: 1240px; margin: 0 auto; padding: 84px 32px 20px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 26px;\">\n      <h2 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; margin: 0;\">Training for real people with real lives<\/h2>\n      <div style=\"font-size: 13px; color: oklch(0.50 0.03 168);\">Is this a fit?<\/div>\n    <\/div>\n    <div style=\"font-size: 15px; line-height: 1.7; color: oklch(0.375 0.028 168); max-width: 720px;\">Above &amp; Beyond may be a good fit if you&#8217;re new to exercise, returning after time away, working around an old injury, looking for better strength or mobility, training with a partner, or simply ready for coaching that is challenging without being punishing.<\/div>\n  <\/div>\n\n  <sc-if value=\"{{ showTestimonials }}\" hint-placeholder-val=\"{{ true }}\">\n    <div id=\"testimonials\" style=\"max-width: 1240px; margin: 0 auto; padding: 84px 32px 20px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 26px;\">\n        <h2 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; margin: 0;\">Clients<\/h2>\n        <div style=\"font-size: 13px; color: oklch(0.50 0.03 168);\">In their words<\/div>\n      <\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px;\">\n        <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 24px;\">\n          <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: oklch(0.895 0.055 45); line-height: 0.6;\">“<\/div>\n          <div style=\"font-size: 15px; line-height: 1.7; color: oklch(0.325 0.03 168); margin-top: 10px;\">Ellen provided not only the training but also a bond — learning from each other about life, health, cooking and much else. Her clients range in age from their 90s to their 30s, and that's a skill many people don't have.<\/div>\n          <div style=\"font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-top: 16px;\">Jerry W. &middot; Long-time client<\/div>\n        <\/div>\n        <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 24px;\">\n          <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: oklch(0.895 0.055 45); line-height: 0.6;\">“<\/div>\n          <div style=\"font-size: 15px; line-height: 1.7; color: oklch(0.325 0.03 168); margin-top: 10px;\">I hate working out but knew I needed to get moving. Ellen makes what could be a slog fun and challenging. She&#8217;ll modify anything to fit your needs and your body while still making sure you&#8217;re getting in a good workout.<\/div>\n          <div style=\"font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-top: 16px;\">Chloe W. &middot; Virtual client since 2020<\/div>\n        <\/div>\n        <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 24px;\">\n          <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: oklch(0.895 0.055 45); line-height: 0.6;\">“<\/div>\n          <div style=\"font-size: 15px; line-height: 1.7; color: oklch(0.325 0.03 168); margin-top: 10px;\">My husband has bilateral knee replacements, plus a hip and a shoulder. Ellen built a program that strengthened the supporting tissue without putting stress on the joint replacements.<\/div>\n          <div style=\"font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-top: 16px;\">Nicki &amp; Myron W. &middot; Training as a couple<\/div>\n        <\/div>\n      <\/div>\n      <style>details.abf-more>summary::-webkit-details-marker{display:none}details.abf-more>summary::marker{content:''}details.abf-more>summary{list-style:none}details.abf-more>summary:hover{background:oklch(0.955 0.02 45)}details.abf-more[open] .abf-show{display:none}details.abf-more:not([open]) .abf-hide{display:none}<\/style>\n      <details class=\"abf-more\" style=\"margin-top: 18px;\"><summary style=\"cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.55 0.14 38); border: 1px solid oklch(0.875 0.05 40); border-radius: 999px; padding: 11px 22px; user-select: none; transition: background .15s ease;\"><span class=\"abf-show\">Read five more &#43;<\/span><span class=\"abf-hide\">Show fewer &#8722;<\/span><\/summary>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-top: 18px;\"><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 24px;\"><div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: oklch(0.895 0.055 45); line-height: 0.6;\">“<\/div><div style=\"font-size: 15px; line-height: 1.7; color: oklch(0.325 0.03 168); margin-top: 10px;\">I was immediately impressed by Ellen&#8217;s ability to keep my interest in the workouts while pushing me to excel. She created a personalized plan that was challenging but achievable, and taught me proper form and technique. I am stronger, faster, and more agile.<\/div><div style=\"font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-top: 16px;\">Holly S. &middot; 7+ years training<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 24px;\"><div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: oklch(0.895 0.055 45); line-height: 0.6;\">“<\/div><div style=\"font-size: 15px; line-height: 1.7; color: oklch(0.325 0.03 168); margin-top: 10px;\">We began in small group classes in 2012, switched to virtual during Covid, and for the past three years she has trained us in our home. This year we focused on core strength and flexibility and noticed an improvement in our golf game.<\/div><div style=\"font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-top: 16px;\">Heidi &amp; Jacy C. &middot; Since 2012<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 24px;\"><div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: oklch(0.895 0.055 45); line-height: 0.6;\">“<\/div><div style=\"font-size: 15px; line-height: 1.7; color: oklch(0.325 0.03 168); margin-top: 10px;\">She worked to ensure I was always challenged, adapting to any constraints injuries or health might create. Today I am a healthier, more mobile, stronger person for having worked so long with her.<\/div><div style=\"font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-top: 16px;\">Rita C. &middot; 10 years training<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 24px;\"><div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: oklch(0.895 0.055 45); line-height: 0.6;\">“<\/div><div style=\"font-size: 15px; line-height: 1.7; color: oklch(0.325 0.03 168); margin-top: 10px;\">Ellen is an excellent workout partner. She challenges and encourages so you can make the best of your workout, and provides alternate exercises when needed. Ellen has your back&hellip; and your biceps, core and quads!<\/div><div style=\"font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-top: 16px;\">A. L.<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 24px;\"><div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; color: oklch(0.895 0.055 45); line-height: 0.6;\">“<\/div><div style=\"font-size: 15px; line-height: 1.7; color: oklch(0.325 0.03 168); margin-top: 10px;\">Ellen knew when to challenge me and I accepted those challenges willingly. She is very thoughtful in the programs she engineers and tailors them to your abilities. It only takes a few workouts to see she will be an advocate in your fitness journey.<\/div><div style=\"font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-top: 16px;\">Brady K.<\/div><\/div><\/div>\n      <\/details>\n    <\/div>\n  <\/sc-if>\n\n  <div id=\"resources\" style=\"max-width: 1240px; margin: 0 auto; padding: 84px 32px 20px;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px;\">\n      <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\">\n        <h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.05em; text-transform: uppercase; margin: 0;\">New client forms<\/h3>\n        <div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">Health history, waiver, and goals questionnaire — fill them out before session one.<\/div>\n        <a href=\"forms/\" style=\"display: inline-block; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; margin-top: 16px;\">Open forms →<\/a>\n      <\/div>\n      <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\">\n        <h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.05em; text-transform: uppercase; margin: 0;\">PWR!Moves®<\/h3>\n        <div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">Parkinson&#8217;s-specific movement training, integrated into personal training or a small-group class. Personal training works alongside&mdash;not instead of&mdash;medical or physical-therapy care.<\/div>\n        <a href=\"pwr-moves/\" style=\"display: inline-block; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; margin-top: 16px;\">Learn more →<\/a>\n      <\/div>\n      <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\">\n        <h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.05em; text-transform: uppercase; margin: 0;\">Recipes<\/h3>\n        <div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">Everyday meals Ellen actually cooks &mdash; practical, training-friendly, and genuinely quick. Cookies included.<\/div>\n        <a href=\"recipes/\" style=\"display: inline-block; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; margin-top: 16px;\">Browse recipes →<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"faq\" style=\"max-width: 1240px; margin: 0 auto; padding: 84px 32px 20px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 26px;\">\n      <h2 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; margin: 0;\">Questions, answered<\/h2>\n      <div style=\"font-size: 13px; color: oklch(0.50 0.03 168);\">Before you book<\/div>\n    <\/div>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px;\"><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\"><h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.05em; text-transform: uppercase; font-size: 19px; margin: 0;\">I&#8217;m new to exercise. Can I start?<\/h3><div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">Yes. A first session is about meeting you where you are, not testing you. Ellen builds from what you can do comfortably today and adds from there.<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\"><h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.05em; text-transform: uppercase; font-size: 19px; margin: 0;\">What if I have an old injury or joint concern?<\/h3><div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">That is common, and it is what corrective-exercise training is for. Ellen programs around the joint and strengthens what supports it. Personal training works alongside&mdash;not instead of&mdash;medical or physical-therapy care, so bring any guidance your doctor or physical therapist has given you.<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\"><h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.05em; text-transform: uppercase; font-size: 19px; margin: 0;\">Do you train couples or friends?<\/h3><div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">Yes. Semi-private sessions are built for two, and each person still gets programming that fits them. Each participant is charged three-quarters of the normal rate.<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\"><h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.05em; text-transform: uppercase; font-size: 19px; margin: 0;\">What should I have available at home?<\/h3><div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">Enough clear floor space to move, and that is genuinely it. Ellen brings the equipment. If you already own kit you would like to use, tell her and she will program around it.<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\"><h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.05em; text-transform: uppercase; font-size: 19px; margin: 0;\">How does virtual training work?<\/h3><div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">A live video session, coached in real time&mdash;not a recording. It works from a living room, a hotel room, or out of state, with whatever equipment you have, or none at all.<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\"><h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.05em; text-transform: uppercase; font-size: 19px; margin: 0;\">How do packages and cancellations work?<\/h3><div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">Training time is sold by the hour and used in 15-minute increments across any format. Cancellations need 24 hours&#8217; notice; inside that window the session is charged, though it can often be rescheduled later the same week if there is availability.<\/div><\/div><div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 20px; padding: 26px;\"><h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.05em; text-transform: uppercase; font-size: 19px; margin: 0;\">Which areas do you serve?<\/h3><div style=\"font-size: 14px; line-height: 1.65; color: oklch(0.435 0.025 168); margin-top: 10px;\">Scottsdale, Paradise Valley, Phoenix, Cave Creek, Mesa, Tempe, Glendale, and nearby communities. Virtual sessions are available anywhere.<\/div><\/div><\/div>\n  <\/div>\n\n  <div id=\"book\" style=\"max-width: 1240px; margin: 0 auto; padding: 84px 32px 96px;\">\n    <div style=\"background: oklch(0.995 0.003 45); border: 1px solid oklch(0.905 0.022 45); border-radius: 24px; padding: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px;\">\n      <div>\n        <h2 style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; margin: 0;\">Start with a free consult<\/h2>\n        <div style=\"font-size: 15px; line-height: 1.7; color: oklch(0.415 0.025 168); margin-top: 16px; max-width: 460px; text-wrap: pretty;\">Twenty minutes, no pressure — your history, what hurts, what you want to be able to do. Ellen replies personally, usually the same day.<\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 26px; font-size: 14px;\">\n          <div style=\"display: flex; gap: 10px; align-items: center;\"><div style=\"width: 6px; height: 6px; border-radius: 50%; background: oklch(0.895 0.055 45);\"><\/div>ellen@elliebfit.com<\/div>\n          <div style=\"display: flex; gap: 10px; align-items: center;\"><div style=\"width: 6px; height: 6px; border-radius: 50%; background: oklch(0.895 0.055 45);\"><\/div>Serving Scottsdale, Phoenix &amp; the East Valley<\/div>\n          <div style=\"display: flex; gap: 10px; align-items: center;\"><div style=\"width: 6px; height: 6px; border-radius: 50%; background: oklch(0.895 0.055 45);\"><\/div>Virtual sessions by request, anywhere<\/div>\n        <\/div>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px;\">\n          <div>\n            <label for=\"abf-name\" style=\"font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-bottom: 6px; display: block;\">Name<\/label>\n            <input name=\"name\" autocomplete=\"name\" aria-required=\"true\" type=\"text\" id=\"abf-name\" placeholder=\"Jordan M.\" value=\"{{ name }}\" sc-camel-on-change=\"{{ setName }}\" style=\"width: 100%; box-sizing: border-box; border: 1px solid oklch(0.905 0.022 45); border-radius: 4px; padding: 13px 14px; font-size: 14px; font-family: inherit; color: oklch(0.30 0.03 168); background: oklch(0.985 0.006 85);\">\n          <\/div>\n          <div>\n            <label for=\"abf-email\" style=\"font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-bottom: 6px; display: block;\">Email<\/label>\n            <input name=\"email\" autocomplete=\"email\" aria-required=\"true\" type=\"email\" id=\"abf-email\" placeholder=\"you@email.com\" value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" style=\"width: 100%; box-sizing: border-box; border: 1px solid oklch(0.905 0.022 45); border-radius: 4px; padding: 13px 14px; font-size: 14px; font-family: inherit; color: oklch(0.30 0.03 168); background: oklch(0.985 0.006 85);\">\n          <\/div>\n        <\/div>\n        <div>\n          <div id=\"abf-interest-label\" style=\"font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-bottom: 6px;\">I'm interested in<\/div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n            <button type=\"button\" style=\"{{ chipInHome }}\" sc-camel-on-click=\"{{ pickInHome }}\">In-home<\/button>\n            <button type=\"button\" style=\"{{ chipSemi }}\" sc-camel-on-click=\"{{ pickSemi }}\">Semi-private<\/button>\n            <button type=\"button\" style=\"{{ chipVirtual }}\" sc-camel-on-click=\"{{ pickVirtual }}\">Virtual<\/button>\n            <button type=\"button\" style=\"{{ chipFriday }}\" sc-camel-on-click=\"{{ pickFriday }}\">Friday class<\/button>\n          <\/div>\n        <\/div>\n        <div>\n          <label for=\"abf-goal\" style=\"font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.555 0.022 40); margin-bottom: 6px; display: block;\">What are you working toward?<\/label>\n          <textarea name=\"goal\" id=\"abf-goal\" placeholder=\"Cranky left knee, want to hike Camelback by spring…\" value=\"{{ goal }}\" sc-camel-on-change=\"{{ setGoal }}\" rows=\"3\" style=\"width: 100%; box-sizing: border-box; border: 1px solid oklch(0.905 0.022 45); border-radius: 4px; padding: 13px 14px; font-size: 14px; font-family: inherit; line-height: 1.5; color: oklch(0.30 0.03 168); background: oklch(0.985 0.006 85); resize: vertical;\"><\/textarea>\n        <\/div>\n        <button type=\"button\" sc-camel-on-click=\"{{ send }}\" style=\"background: oklch(0.665 0.135 38); color: oklch(0.265 0.032 168); text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase; padding: 17px; border-radius: 4px; border: none; cursor: pointer; width: 100%;\">Send request<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <\/main>\n  <footer style=\"background: linear-gradient(160deg, oklch(0.955 0.035 45) 0%, oklch(0.965 0.022 90) 55%, oklch(0.945 0.035 165) 100%); color: oklch(0.34 0.035 168);\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 48px 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px;\">\n      <div>\n        <div style=\"display: flex; align-items: center; gap: 11px; margin-bottom: 14px;\">\n          <svg sc-camel-view-box=\"0 0 100 100\" width=\"34\" height=\"34\" fill=\"none\" style=\"flex: none;\">\n            <polygon points=\"50,8 92,50 76,50 50,24 24,50 8,50\" fill=\"currentColor\"><\/polygon>\n            <polygon points=\"50,30 92,72 76,72 50,46 24,72 8,72\" fill=\"currentColor\" opacity=\"0.62\"><\/polygon>\n            <polygon points=\"50,52 92,94 76,94 50,68 24,94 8,94\" fill=\"currentColor\" opacity=\"0.3\"><\/polygon>\n          <\/svg>\n          <div>\n            <div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; line-height: 0.95; letter-spacing: 0.04em; text-transform: uppercase;\">Above &amp; Beyond<\/div>\n            <div style=\"font-size: 8px; letter-spacing: 0.32em; text-transform: uppercase; margin-top: 4px; color: oklch(0.50 0.03 168);\">Fitness LLC<\/div>\n          <\/div>\n        <\/div>\n        <div style=\"font-size: 13px; line-height: 1.7; color: oklch(0.44 0.03 168);\">In-home and virtual personal training across the Phoenix metro.<\/div>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 9px; font-size: 13px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.50 0.03 168); margin-bottom: 4px;\">Site<\/div>\n        <a href=\"#training\" style=\"color: oklch(0.40 0.04 168);\">Training<\/a>\n        <a href=\"#classes\" style=\"color: oklch(0.40 0.04 168);\">Classes<\/a>\n        <a href=\"#about\" style=\"color: oklch(0.40 0.04 168);\">About Ellen<\/a>\n        <a href=\"#rates\" style=\"color: oklch(0.40 0.04 168);\">Rates<\/a>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 9px; font-size: 13px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.50 0.03 168); margin-bottom: 4px;\">Resources<\/div>\n        <a href=\"recipes/\" style=\"color: oklch(0.40 0.04 168);\">Recipes<\/a>\n        <a href=\"forms/\" style=\"color: oklch(0.40 0.04 168);\">New client forms<\/a>\n        <a href=\"pwr-moves/\" style=\"color: oklch(0.40 0.04 168);\">PWR!Moves®<\/a>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 9px; font-size: 13px;\">\n        <div style=\"font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.50 0.03 168); margin-bottom: 4px;\">Get in touch<\/div>\n        <a href=\"mailto:ellen@elliebfit.com\" style=\"color: oklch(0.40 0.04 168);\">ellen@elliebfit.com<\/a>\n        <a href=\"https://www.instagram.com/above.and.beyond.fitness/\" style=\"color: oklch(0.40 0.04 168);\">Instagram<\/a>\n        <a href=\"https://www.facebook.com/elliebfit/\" style=\"color: oklch(0.40 0.04 168);\">Facebook<\/a>\n      <\/div>\n    <\/div>\n    <div style=\"border-top: 1px solid oklch(0.87 0.03 45);\">\n      <div style=\"max-width: 1240px; margin: 0 auto; padding: 18px 32px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.50 0.03 168);\">© 2026 Above &amp; Beyond Fitness LLC · Scottsdale, Arizona<\/div>\n    <\/div>\n  <\/footer>\n<\/div>\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showTestimonials&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { name: '', email: '', goal: '', picks: ['In-home'] };\n  set(k) { return (e) => this.setState({ [k]: e.target.value }); }\n  toggle(tag) {\n    return () => this.setState(s => ({\n      picks: s.picks.includes(tag) ? s.picks.filter(t => t !== tag) : [...s.picks, tag]\n    }));\n  }\n  send = (e) => {\n    e.preventDefault();\n    const { name, email, goal, picks } = this.state;\n    const body = [\n      'Name: ' + (name || '—'),\n      'Email: ' + (email || '—'),\n      'Interested in: ' + (picks.join(', ') || '—'),\n      '',\n      'Working toward:',\n      goal || '—'\n    ].join('\\n');\n    window.location.href = 'mailto:ellen@elliebfit.com?subject=' +\n      encodeURIComponent('Free consult request' + (name ? ' — ' + name : '')) +\n      '&body=' + encodeURIComponent(body);\n  };\n  chipStyle(tag) {\n    const on = this.state.picks.includes(tag);\n    return {\n      background: on ? 'oklch(0.665 0.135 38)' : 'oklch(0.885 0.042 165 / 0.35)',\n      color: on ? 'oklch(0.265 0.032 168)' : 'oklch(0.45 0.06 38)',\n      fontSize: '11px', letterSpacing: '0.14em', textTransform: 'uppercase',\n      padding: '9px 14px', borderRadius: '999px', border: 'none', cursor: 'pointer',\n      fontFamily: 'inherit'\n    };\n  }\n  renderVals() {\n    return {\n      showTestimonials: this.props.showTestimonials ?? true,\n      name: this.state.name, email: this.state.email, goal: this.state.goal,\n      setName: this.set('name'), setEmail: this.set('email'), setGoal: this.set('goal'),\n      send: this.send,\n      chipInHome: this.chipStyle('In-home'), pickInHome: this.toggle('In-home'),\n      chipSemi: this.chipStyle('Semi-private'), pickSemi: this.toggle('Semi-private'),\n      chipVirtual: this.chipStyle('Virtual'), pickVirtual: this.toggle('Virtual'),\n      chipFriday: this.chipStyle('Friday class'), pickFriday: this.toggle('Friday class')\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
